<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>새 탭</title>
<style>
  :root { --brand: #1b4e91; --brand-dark: #17427c; }
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Malgun Gothic', 'Segoe UI', sans-serif; background: #f3f4f6; color: #1f2328; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 56px 24px 40px; }
  .hero { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
  .hero img { width: 72px; height: 72px; }
  .hero h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .hero p { margin: 6px 0 0; color: #5a6270; font-size: 14px; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px; border-radius: 8px;
         border: 1px solid transparent; font: inherit; font-size: 15px; cursor: pointer; background: var(--brand); color: #fff; }
  .btn:hover { background: var(--brand-dark); }
  .btn .key { font-size: 12px; opacity: .8; border: 1px solid rgba(255,255,255,.5); border-radius: 4px; padding: 1px 6px; }
  .btn.secondary { background: #fff; color: #1f2328; border-color: #d0d5dc; }
  .btn.secondary:hover { background: #f7f8fa; }
  .drop { border: 2px dashed #c6ccd5; border-radius: 12px; padding: 20px; text-align: center; color: #6b7482;
          font-size: 14px; background: #fafbfc; margin-bottom: 36px; }
  h2 { font-size: 13px; color: #5a6270; font-weight: 600; letter-spacing: .04em; margin: 0 0 10px; }
  .recent { list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; overflow: hidden; }
  .recent li { display: flex; align-items: center; gap: 14px; padding: 11px 16px; border-top: 1px solid #eef0f3; cursor: pointer; }
  .recent li:first-child { border-top: 0; }
  .recent li:hover { background: #f5f7fa; }
  .recent .ic { width: 34px; height: 34px; flex: none; border-radius: 7px; background: #e8eef7; color: var(--brand);
                font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .recent .text { min-width: 0; flex: 1; }
  .recent .name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent .dir { font-size: 12px; color: #7a8290; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .recent .when { margin-left: auto; font-size: 12px; color: #8a919c; flex: none; }
  .recent .empty { padding: 18px; color: #8a919c; font-size: 13px; cursor: default; }
  .recent .empty:hover { background: #fff; }
  .foot { margin-top: 28px; font-size: 12px; color: #9aa1ab; line-height: 1.6; }
  .notice { display: flex; gap: 12px; align-items: flex-start; margin: 0 0 22px; padding: 11px 14px; border: 1px solid #c9d8f5;
            border-left: 4px solid var(--brand); border-radius: 8px; background: #eef3fd; font-size: 14px; color: #1e2a3a; }
  .notice[hidden] { display: none; }   /* display:flex 가 hidden 속성을 이기지 않게 (공지가 없으면 띠도 없음) */
  .notice p { margin: 0; flex: 1; line-height: 1.5; }
  .notice a { color: var(--brand-dark); font-weight: 600; margin-left: 6px; }
  .notice button { border: none; background: none; cursor: pointer; color: #6b7482; font-size: 15px; line-height: 1; padding: 0 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img src="logo.png" alt="">
    <div>
      <h1>PDF 뷰어</h1>
      <p>PDF를 보고, 형광펜과 메모를 남기고, 페이지를 정리합니다.</p>
    </div>
  </div>
  <div class="notice" id="notice" hidden></div>
  <div class="actions">
    <button class="btn" id="open">파일 열기 <span class="key">Ctrl+O</span></button>
    <button class="btn secondary" id="images">그림을 PDF로</button>
    <button class="btn secondary" id="convert">오피스·한글 문서를 PDF로</button>
  </div>
  <div class="drop">PDF 파일을 이 창에 끌어다 놓으면 열리고, 그림 파일을 놓으면 PDF로 바꿉니다</div>
  <h2>최근 문서</h2>
  <ul class="recent" id="recent"><li class="empty">아직 연 문서가 없습니다</li></ul>
  <div class="foot">도구 메뉴: 페이지 회전 저장 · 용량 줄이기 · 잠금 해제 · 이미지 추출 · PDF → 이미지 / 텍스트 / Word · 그림 → PDF · 오피스 / 한글 → PDF</div>
</div>
<script>
(function () {
  var wv = window.chrome && window.chrome.webview;
  function post(s) { if (wv) wv.postMessage(s); }
  document.getElementById("open").onclick = function () { post("open"); };
  document.getElementById("convert").onclick = function () { post("officetopdf"); };
  document.getElementById("images").onclick = function () { post("imagestopdf"); };
  // 프로젝트 공지 (notice.json: id, text/text_ko, url(https), label/label_ko, kind, until) — 비어 있으면 안 보임
  fetch("notice.json", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (n) {
      if (!n || typeof n !== "object") return;
      var text = n.text_ko || n.text;
      if (!text) return;
      if (n.until && new Date(n.until + "T23:59:59") < new Date()) return;
      var id = String(n.id || text);
      try { if (localStorage.getItem("notice-dismissed") === id) return; } catch (e) {}
      var box = document.getElementById("notice");
      var p = document.createElement("p");
      p.textContent = (n.kind === "sponsor" ? "♥ " : n.kind === "update" ? "새 소식: " : "") + String(text).slice(0, 300);
      if (n.url && /^https:\/\//.test(n.url)) {
        var a = document.createElement("a");
        a.href = n.url; a.textContent = n.label_ko || n.label || "열기";
        a.onclick = function (ev) { ev.preventDefault(); post("openurl|" + n.url); };
        p.appendChild(a);
      }
      var x = document.createElement("button");
      x.type = "button"; x.textContent = "✕"; x.title = "닫기";
      x.onclick = function () { try { localStorage.setItem("notice-dismissed", id); } catch (e) {} box.hidden = true; };
      box.appendChild(p); box.appendChild(x); box.hidden = false;
    })
    .catch(function () {});
  fetch("recent.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (list) {
      if (!list || !list.length) return;
      var ul = document.getElementById("recent");
      ul.innerHTML = "";
      list.forEach(function (it) {
        var li = document.createElement("li");
        li.innerHTML = '<div class="ic">PDF</div><div class="text"><div class="name"></div><div class="dir"></div></div><div class="when"></div>';
        li.querySelector(".name").textContent = it.name;
        li.querySelector(".dir").textContent = it.dir;
        li.querySelector(".when").textContent = it.when;
        li.title = it.path;
        li.onclick = function () { post("openpath|" + it.path); };
        ul.appendChild(li);
      });
    })
    .catch(function () {});
})();
</script>
</body>
</html>
